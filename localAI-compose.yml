version: '3.8'

services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - /var/mnt/Data/open-webui-data:/app/backend/data:z
    environment:
      - OLLAMA_BASE_URLS=http://ollama:11434;http://ollamaAMD:11434;http://ollamaCPU:11434
      - ANONYMIZED_TELEMETRY=False
      - RAG_EMBEDDING_ENGINE=ollama
      - RAG_OLLAMA_BASE_URL=http://ollamaCPU:11434
      - RAG_EMBEDDING_MODEL=qwen3-embedding:0.6b
      - RAG_EMBEDDING_BATCH_SIZE=1
      - OFFLINE_MODE=true
      - ENABLE_OPENAI_API=true
      - OPENAI_API_BASE_URL=http://vllm:8000/v1
      - OPENAI_API_KEY=unused

  vllm:
    image: docker.io/vllm/vllm-openai:latest
    container_name: vllm
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - /var/mnt/Data/vllm-models:/models:z
    devices:
      - nvidia.com/gpu=all
    security_opt:
      - label=disable
      - no-new-privileges:true
    shm_size: "1gb"
    environment:
      - HF_HOME=/models/.cache/huggingface
      - HF_HUB_DISABLE_TELEMETRY=1
      - HF_HUB_OFFLINE=1
      - TRANSFORMERS_OFFLINE=1
    entrypoint:
      - python3
      - -m
      - vllm.entrypoints.openai.api_server
    command:
      - "--model"
      - "/models/Qwen3-4B-AWQ"
      - "--served-model-name"
      - "qwen3-4b-vllm"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8000"
      - "--dtype"
      - "half"
      - "--quantization"
      - "awq"
      - "--max-model-len"
      - "auto"
      - "--max-num-seqs"
      - "1"
      - "--max-num-batched-tokens"
      - "256"
      - "--enable-chunked-prefill"
      - "--gpu-memory-utilization"
      - "0.95"
      - "--enforce-eager"
      - "--enable-auto-tool-choice"
      - "--tool-call-parser"
      - "hermes"
      - "--default-chat-template-kwargs"
      - '{"enable_thinking": false}'
  
  ollamaAMD:
    image: docker.io/ollama/ollama:latest
    container_name: ollamaAMD
    restart: unless-stopped
    ports:
      - "127.0.0.1:11435:11434"
    volumes:
      - /var/mnt/Data/ollama-models:/root/.ollama:z
    devices:
      - /dev/dri
    security_opt:
      - label=disable
    environment:
      - OLLAMA_IGPU_ENABLE=1
      - OLLAMA_NO_CLOUD=true
      - OLLAMA_ORIGINS=moz-extension://*,vscode-webview://*,http://localhost:8080,http://127.0.0.1:8080

  ollamaCPU:
    image: docker.io/ollama/ollama:latest
    container_name: ollamaCPU
    restart: unless-stopped
    ports:
      - "127.0.0.1:11436:11434"
    volumes:
      - /var/mnt/Data/ollama-models:/root/.ollama:z
    security_opt:
      - label=disable
    environment:
      - OLLAMA_NO_CLOUD=true
      - OLLAMA_ORIGINS=moz-extension://*,vscode-webview://*,http://localhost:8080,http://127.0.0.1:8080

  ollama:
    image: docker.io/ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - /var/mnt/Data/ollama-models:/root/.ollama:z
    security_opt:
      - label=disable
    environment:
      - OLLAMA_NO_CLOUD=true
      - OLLAMA_ORIGINS=moz-extension://*,vscode-webview://*,http://localhost:8080,http://127.0.0.1:8080
      - OLLAMA_CONTEXT_LENGTH=4096
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_KEEP_ALIVE=10m
    devices:
      - nvidia.com/gpu=all
  
  comfyui:
    image: localhost/comfyui-local:gpu-only-v1
    container_name: comfyui
    restart: "no"
    userns_mode: "keep-id"
    ports:
      - "127.0.0.1:8188:8188"
    networks:
      - comfyui-isolated
    volumes:
      - /var/mnt/Data/comfyui/models:/opt/ComfyUI/models:z
      - /var/mnt/Data/comfyui/output:/opt/ComfyUI/output:z
      - /var/mnt/Data/comfyui/input:/opt/ComfyUI/input:z
      - /var/mnt/Data/comfyui/user:/opt/ComfyUI/user:z
      - /var/mnt/Data/comfyui/temp:/opt/ComfyUI/temp:z
    security_opt:
      - label=disable
      - no-new-privileges:true
    environment:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
    devices:
      - nvidia.com/gpu=all
    command:
      - --listen
      - "0.0.0.0"
      - --port
      - "8188"
      - --reserve-vram
      - "0.5"
      - --cache-none
      - --preview-method
      - none
      - --disable-all-custom-nodes
      - --offline
      - --disable-auto-launch
      - --temp-directory
      - /opt/ComfyUI/temp/session

networks:
  comfyui-isolated:
    name: comfyui-isolated
    driver: bridge
    internal: true
