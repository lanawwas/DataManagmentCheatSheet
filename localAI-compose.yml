services:
  llamaNVIDIA:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    container_name: llamaNVIDIA
    restart: unless-stopped
    ports:
      - "127.0.0.1:8082:8080"
    volumes:
      - /var/mnt/Data/ollama-models:/ollama:ro,z
      - /var/mnt/Data/llama-models:/models:ro,z
    devices:
      - nvidia.com/gpu=all
    security_opt:
      - label=disable
      - no-new-privileges:true
    environment:
      - LLAMA_ARG_HOST=0.0.0.0
      - LLAMA_ARG_PORT=8080
    command:
      - "--models-dir"
      - "/models"
      - "--models-max"
      - "1"
      - "--models-autoload"
      - "--webui"
      - "--cors-origins"
      - "localhost"
      - "--parallel"
      - "1"
      - "--batch-size"
      - "256"
      - "--ubatch-size"
      - "64"
      - "--cache-ram"
      - "0"
      - "--device"
      - "CUDA0"
      # Let llama.cpp choose the layer placement.
      - "--n-gpu-layers"
      - "auto"
      - "--fit"
      - "on"
      # Aim to leave 0.2 GiB free for desktop/runtime headroom.
      - "--fit-target"
      - "256"
      - "--jinja"
      - "--reasoning"
      - "off"
      - "--temp"
      - "0.6"
      - "--top-k"
      - "20"
      - "--top-p"
      - "0.95"
      - "--min-p"
      - "0.0"
      - "--repeat-penalty"
      - "1.0"
      - "--offline"
  llamaAMD:
    image: ghcr.io/ggml-org/llama.cpp:server-vulkan
    container_name: llamaAMD
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      # Existing Ollama model weights.
      - /var/mnt/Data/ollama-models:/ollama:ro,z
      # Named GGUF links already created.
      - /var/mnt/Data/llama-models:/models:ro,z
    devices:
      - /dev/dri/renderD128:/dev/dri/renderD128
    group_add:
      - keep-groups
    security_opt:
      - label=disable
      - no-new-privileges:true
    environment:
      # Configure here instead of duplicating in command.
      - LLAMA_ARG_HOST=0.0.0.0
      - LLAMA_ARG_PORT=8080
    command:
      # Router: discover your named GGUF models.
      - "--models-dir"
      - "/models"
      # Keep only one chat model resident.
      - "--models-max"
      - "1"
      - "--models-autoload"
      # Web UI and API.
      - "--webui"
      # Restrict cross-origin browser access.
      - "--cors-origins"
      - "localhost"
      # Single-user inference.
      - "--parallel"
      - "1"
      # Logical and physical prompt-processing batches.
      - "--batch-size"
      - "256"
      - "--ubatch-size"
      - "64"
      # Avoid the additional large host prompt cache.
      - "--cache-ram"
      - "0"
      # Confirm this device ID with --list-devices.
      - "--device"
      - "Vulkan0"
      # Partial iGPU offload; remaining layers execute on CPU.
      - "--n-gpu-layers"
      - "12"
      # Chat-template and structured tool-call support.
      - "--jinja"
      # Disable reasoning by default.
      - "--reasoning"
      - "off"
      # Initial Qwen-oriented sampling defaults.
      - "--temp"
      - "0.6"
      - "--top-k"
      - "20"
      - "--top-p"
      - "0.95"
      - "--min-p"
      - "0.0"
      - "--repeat-penalty"
      - "1.0"
      # Local model loading only.
      - "--offline"

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - /var/mnt/Data/open-webui-data:/app/backend/data:z
    environment:
      - OLLAMA_BASE_URLS=http://ollama:11434;http://ollamaAMD:11434;http://ollamaCPU:11434
      - ANONYMIZED_TELEMETRY=False
      - RAG_EMBEDDING_ENGINE=ollama
      - RAG_OLLAMA_BASE_URL=http://ollamaAMD:11434
      - RAG_EMBEDDING_MODEL=qwen3-embedding:0.6b
      - RAG_EMBEDDING_BATCH_SIZE=1
      - ENABLE_OPENAI_API=true
      - OPENAI_API_BASE_URL=http://llamaNVIDIA:8080/v1
      - OPENAI_API_KEY=unused
      - AUDIO_STT_ENGINE=whisper
      - WHISPER_MODEL=large-v3 
      - WHISPER_MODEL_DIR=/app/backend/data/cache/whisper/models
      - OFFLINE_MODE=true
      - HF_HUB_OFFLINE=1
      - HF_HUB_DISABLE_TELEMETRY=1
      
  vllm:
    image: docker.io/vllm/vllm-openai:latest
    container_name: vllm
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - /var/mnt/Data/vllm-models:/models:z
    devices:
      - nvidia.com/gpu=all
    security_opt:
      - label=disable
      - no-new-privileges:true
    shm_size: "1gb"
    environment:
      - HF_HOME=/models/.cache/huggingface
      - HF_HUB_DISABLE_TELEMETRY=1
      - HF_HUB_OFFLINE=1
      - TRANSFORMERS_OFFLINE=1
    entrypoint:
      - python3
      - -m
      - vllm.entrypoints.openai.api_server
    command:
      - "--model"
      - "/models/Qwen3-4B-AWQ"
      - "--served-model-name"
      - "qwen3-4b-vllm"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8000"
      - "--dtype"
      - "half"
      - "--quantization"
      - "awq"
      - "--max-model-len"
      - "auto"
      - "--max-num-seqs"
      - "1"
      - "--max-num-batched-tokens"
      - "256"
      - "--enable-chunked-prefill"
      - "--gpu-memory-utilization"
      - "0.95"
      - "--enforce-eager"
      - "--enable-auto-tool-choice"
      - "--tool-call-parser"
      - "hermes"
      - "--default-chat-template-kwargs"
      - '{"enable_thinking": false}'
  
  ollamaAMD:
    image: docker.io/ollama/ollama:latest
    container_name: ollamaAMD
    restart: unless-stopped
    ports:
      - "127.0.0.1:11435:11434"
    volumes:
      - /var/mnt/Data/ollama-models:/root/.ollama:z
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    security_opt:
      - label=disable
    environment:
      - OLLAMA_IGPU_ENABLE=1
      - OLLAMA_NO_CLOUD=true
      - OLLAMA_ORIGINS=moz-extension://*,vscode-webview://*,http://localhost:8080,http://127.0.0.1:8080

  ollamaCPU:
    image: docker.io/ollama/ollama:latest
    container_name: ollamaCPU
    restart: unless-stopped
    ports:
      - "127.0.0.1:11436:11434"
    volumes:
      - /var/mnt/Data/ollama-models:/root/.ollama:z
    security_opt:
      - label=disable
    environment:
      - OLLAMA_NO_CLOUD=true
      - OLLAMA_ORIGINS=moz-extension://*,vscode-webview://*,http://localhost:8080,http://127.0.0.1:8080

  ollama:
    image: docker.io/ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - /var/mnt/Data/ollama-models:/root/.ollama:z
    security_opt:
      - label=disable
    environment:
      - OLLAMA_NO_CLOUD=true
      - OLLAMA_ORIGINS=moz-extension://*,vscode-webview://*,http://localhost:8080,http://127.0.0.1:8080
      - OLLAMA_CONTEXT_LENGTH=4096
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_KEEP_ALIVE=10m
    devices:
      - nvidia.com/gpu=all
  
  comfyui:
    image: localhost/comfyui-local:gpu-only-v1
    container_name: comfyui
    restart: "no"
    userns_mode: "keep-id"
    ports:
      - "127.0.0.1:8188:8188"
    networks:
      - comfyui-isolated
    volumes:
      - /var/mnt/Data/comfyui/models:/opt/ComfyUI/models:z
      - /var/mnt/Data/comfyui/output:/opt/ComfyUI/output:z
      - /var/mnt/Data/comfyui/input:/opt/ComfyUI/input:z
      - /var/mnt/Data/comfyui/user:/opt/ComfyUI/user:z
      - /var/mnt/Data/comfyui/temp:/opt/ComfyUI/temp:z
    security_opt:
      - label=disable
      - no-new-privileges:true
    environment:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
    devices:
      - nvidia.com/gpu=all
    command:
      - --listen
      - "0.0.0.0"
      - --port
      - "8188"
      - --reserve-vram
      - "0.5"
      - --cache-none
      - --preview-method
      - none
      - --disable-all-custom-nodes
      - --offline
      - --disable-auto-launch
      - --temp-directory
      - /opt/ComfyUI/temp/session

networks:
  comfyui-isolated:
    name: comfyui-isolated
    driver: bridge
    internal: true
